package: blog                                 # root package name of the generated code
module: example.com/blogservice/internal/blog # import path of the --out directory

entities:
  - name: Post
    plural: posts         # optional; defaults to a naive pluralization
    fields:
      - name: id
        type: uuid
        primary: true      # exactly one primary field is required per entity
      - name: title
        type: string
        required: true
        validate: "min=1,max=200"
      - name: body
        type: text
      - name: published
        type: bool
        default: false
      - name: views
        type: int64
        default: 0
      - name: metadata
        type: json
      - name: author
        type: references   # belongs-to relation
        target: Author
    options:
      timestamps: true     # adds created_at / updated_at

  - name: Author
    fields:
      - name: id
        type: uuid
        primary: true
      - name: email
        type: string
        required: true
        unique: true
        validate: "email"
      - name: name
        type: string
      - name: born_on
        type: date

  - name: Comment
    fields:
      - name: id
        type: int64
        primary: true
      - name: post
        type: references
        target: Post
        required: true
        index: true
      - name: body
        type: text
        required: true
        validate: "max=2000"
      - name: likes
        type: int32
        default: 0
      - name: posted_at
        type: datetime
        default: now

  - name: Tag
    fields:
      - name: slug
        type: string
        primary: true
      - name: label
        type: string
        required: true
      - name: color
        type: string
        default: gray
      - name: weight
        type: float
        default: 1
