package: blog                                 # root package name of the generated code
module: example.com/blogservice/internal/blog # optional; derived from go.mod when omitted, checked when set

entities:
  - name: Post
    plural: posts         # optional; defaults to a naive pluralization
    pagination: cursor    # ?cursor=<next_cursor>; offset (default) takes ?offset=
    order: created_at     # List order, ?dir=asc|desc; defaults to the primary key
    fields:
      - name: id
        type: uuid
        primary: true      # exactly one primary field is required per entity
      - name: title
        type: string
        required: true
        validate: "min=1,max=200"
      - name: body
        type: text
      - name: published
        type: bool
        default: false
        filter: true       # ?published=true
      - name: views
        type: int64
        default: 0
      - name: metadata
        type: json
      - name: author
        type: references   # belongs-to relation
        target: Author
        filter: true
      - name: created_at
        type: datetime
        generate: on_create  # now() on insert, read-only
      - name: updated_at
        type: datetime
        generate: on_write   # now() on insert and every update, read-only

  - name: Author
    fields:
      - name: id
        type: uuid
        primary: true
      - name: email
        type: string
        required: true
        unique: true
        validate: "email"
        filter: true
      - name: name
        type: string
        validate: "max=100"  # checked only when present
      - name: born_on
        type: date

  - name: Comment
    order: posted_at
    fields:
      - name: id
        type: int64
        primary: true
      - name: post
        type: references
        target: Post
        required: true
        index: true
        filter: true         # ?post=<id> lists a post's comments
        on_delete: cascade   # deleting a post deletes its comments
      - name: body
        type: text
        required: true
        validate: "max=2000"
      - name: likes
        type: int32
        default: 0
      - name: posted_at
        type: datetime
        default: now

  - name: Tag
    order: group           # a reserved SQL word; the generator quotes it
    fields:
      - name: slug
        type: string
        primary: true
      - name: label
        type: string
        required: true
      - name: color
        type: string
        default: gray
      - name: weight
        type: float
        default: 1
      - name: group
        type: string
        default: general
        filter: true
        index: true
