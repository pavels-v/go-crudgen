version: "2"

run:
  build-tags:
    - e2e

linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - musttag
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: true
    errorlint:
      errorf: false
      asserts: true
      comparison: true
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: return an error instead of panicking
        - pattern: ^print(ln)?$
          msg: use the logger instead of print
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - importShadow
        - whyNoLint
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nakedret:
      max-func-lines: 30
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: context-as-argument
        - name: context-keys-type
        - name: deep-exit
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    wsl_v5:
      allow-whole-block: true
      disable:
        - branch
        - decl
    sloglint:
      kv-only: true
      static-msg: true
      key-naming-case: snake
    staticcheck:
      checks:
        - all
        - -ST1000
  exclusions:
    generated: lax
    paths:
      - \.gen\.go$
    rules:
      - path: _test\.go
        linters:
          - containedctx
          - forbidigo
          - gochecknoglobals
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - go-crudgen
  exclusions:
    generated: lax
    paths:
      - \.gen\.go$
